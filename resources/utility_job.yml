# Pipeline job: setup -> SAP extract (changed-on date) -> bronze -> silver -> (data vault | gold) -> silver -> gold -> metrics -> data-quality gate -> maintenance
# No cluster is defined, so tasks run on serverless compute (works in Databricks Free Edition).
resources:
  jobs:
    utility_metrics_pipeline:
      name: utility-metrics-pipeline
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"      # daily 06:30
        timezone_id: America/Toronto
        pause_status: PAUSED                         # unpause when you want it to run daily
      tasks:
        - task_key: setup
          notebook_task: {notebook_path: ../notebooks/00_setup.py}

        - task_key: sap_extract
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: ../notebooks/01b_sap_extract.py}

        - task_key: bronze
          depends_on: [{task_key: sap_extract}]
          max_retries: 1                              # restarts once if Auto Loader evolved the schema
          notebook_task: {notebook_path: ../notebooks/02_bronze_autoloader.py}

        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: ../notebooks/03_silver.py}

        - task_key: data_vault
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ../notebooks/03b_data_vault.py}

        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ../notebooks/04_gold.py}

        - task_key: metrics
          depends_on: [{task_key: gold}]
          notebook_task: {notebook_path: ../notebooks/05_metrics.py}

        - task_key: data_quality
          depends_on: [{task_key: metrics}, {task_key: data_vault}]
          notebook_task: {notebook_path: ../notebooks/06_data_quality.py}

        - task_key: maintenance
          depends_on: [{task_key: data_quality}]
          notebook_task: {notebook_path: ../notebooks/07_maintenance.py}
